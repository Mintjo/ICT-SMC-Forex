[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ict-smc-forex"
version = "0.1.0"
description = "ICT/SMC forex analysis toolkit"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

[tool.setuptools.packages.find]
where = ["src"]
